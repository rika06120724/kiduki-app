name: Django CI

on: [push]

jobs:

  build:

    runs-on: ubuntu-latest
    env:                             
      DATABASE_URL: postgres://postgres:password@localhost:5432/kiduki_development
      SECRET_KEY: '&&&^*#o&fulon@o7tpmk@d3(=vhx@bv@wtx-tqvv2piqe=0gc&' # CI専用ダミー
    
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres 
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kiduki_development
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:

      - uses: actions/checkout@v6

      - name: Set up Python

        # This is the version of the action for setting up Python, not the Python version.

        uses: actions/setup-python@v5

        with:

          # Semantic version range syntax or exact version of a Python version

          python-version: '3.12.3'

          # Optional - x64 or x86 architecture, defaults to x64

          architecture: 'x64'

      - name: Install library

        run: pip install -r requirements.txt
      - name: Check manage.py
        run: python manage.py check
      - name: Run tests with coverage
        run: pytest --cov=users --cov-report=xml --cov-report=html